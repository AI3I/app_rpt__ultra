# app_rpt__ultra: recordings served at /recordings/ (a symlink to /opt/asterisk).
# Installed to /etc/apache2/conf-available/ and enabled with a2enconf.
#
# The daily YYYYMMDD.txt activity logs next to the recordings hold DTMF
# commands and telemetry, so they are neither served nor listed.  The
# recordings page (index.html + recordings.json) and the WAV files are.
#
# Both paths are covered: Apache matches <Directory> against the path it walks
# (/var/www/html/recordings/...), not the symlink's target.
<Directory "/var/www/html/recordings">
    IndexIgnore *.txt *.TXT *.tmp
    <FilesMatch "(?i)\.txt$">
        Require all denied
    </FilesMatch>
    <IfModule mod_headers.c>
        <FilesMatch "^(index\.html|recordings\.json)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </IfModule>
</Directory>
<Directory "/opt/asterisk">
    IndexIgnore *.txt *.TXT *.tmp
    <FilesMatch "(?i)\.txt$">
        Require all denied
    </FilesMatch>
    <IfModule mod_headers.c>
        <FilesMatch "^(index\.html|recordings\.json)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </IfModule>
</Directory>
